<section
  class="min-h-screen bg-[#FFF7ED] flex items-center justify-center px-6 relative overflow-hidden"
>
  <!-- Background blobs -->
  <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-[#0F766E]/10 blur-3xl"></div>

  <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full bg-[#D4A373]/15 blur-3xl"></div>

  <!-- Floating icons -->
  <i class="fa-solid fa-utensils absolute top-20 left-16 text-6xl text-[#0F766E]/10 rotate-12"></i>

  <i class="fa-solid fa-location-dot absolute bottom-28 right-20 text-6xl text-[#D4A373]/15"></i>

  <i class="fa-solid fa-star absolute top-1/3 right-32 text-5xl text-[#0F766E]/10"></i>

  <!-- Card -->
  <div
    class="relative z-10 max-w-2xl w-full bg-white rounded-4xl shadow-xl p-10 md:p-16 text-center"
  >
    <!-- Number -->
    <h1 class="text-7xl md:text-9xl font-extrabold text-[#0F766E] leading-none">404</h1>

    <!-- Icon -->
    <div
      class="w-20 h-20 mx-auto mt-20 rounded-full bg-[#0F766E]/10 flex items-center justify-center text-[#0F766E]"
    >
      <i class="fa-solid fa-utensils text-3xl"></i>
    </div>

    <!-- Heading -->
    <h2 class="mt-6 text-3xl md:text-4xl font-bold text-[#1F2937]">Oops… table not found</h2>

    <!-- Text -->
    <p class="mt-4 text-[#6B7280] leading-relaxed max-w-lg mx-auto">

      taken.
    </p>

    <!-- Buttons -->
    <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4">
      <a
        routerLink="/home"
        class="cursor-pointer px-6 py-3 rounded-full bg-[#0F766E] text-white font-semibold hover:bg-[#115E59] transition"
      >
        Back Home
      </a>

      <a
        routerLink="/restaurants"
        class="cursor-pointer px-6 py-3 rounded-full border border-[#0F766E] text-[#0F766E] font-semibold hover:bg-[#0F766E] hover:text-white transition"
      >
        Explore Restaurants
      </a>
    </div>
  </div>
</section>
