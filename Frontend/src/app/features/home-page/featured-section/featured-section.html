<div class="px-6 py-4">
  <div class="sectionTitle mb-6 flex flex-row items-center justify-between">
    <div>
      <div class="inline-flex items-center gap-3 my-8">
        <div class="h-8 w-1.5 bg-linear-to-b from-[#D4A373] to-[#f38e28] rounded-full"></div>
        <p class="text-2xl md:text-3xl font-bold text-[#1F2937]">
          Featured <span class="text-[#D4A373]">Resturants</span>
        </p>
      </div>
    </div>
    <button
      routerLink="/restaurants"
      class="inline-flex items-center gap-3 text-[#6B7280] cursor-pointer hover:text-[#0F766E] transition-colors duration-200"
    >
      <p class="text-sm md:text-lg font-bold">Discover More Resturants</p>
      <i class="fa-solid fa-arrow-right mt-1.5"></i>
    </button>
  </div>

  <div
    class="sectionContent grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"
  >
    @for (r of restaurants(); track r.id) {
      <app-resturant-card [restaurant]="r" actionLabel="Start Booking"></app-resturant-card>
    }
    @if (restaurants().length === 0) {
      <p class="text-gray-400 col-span-5 text-center py-8">No restaurants yet.</p>
    }
  </div>
</div>
