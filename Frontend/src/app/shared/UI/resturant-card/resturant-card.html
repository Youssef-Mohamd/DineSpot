<div
  class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl hover:-translate-y-1 transition duration-300 group"
>
  <div class="relative h-64 overflow-hidden">
    <img
      [src]="getImageUrl()"
      [alt]="restaurant?.name || 'Restaurant card'"
      class="w-full h-full object-cover group-hover:scale-110 duration-300"
    />

    <div
      class="absolute top-4 right-4 px-3 py-1 rounded-full bg-white/90 backdrop-blur-md text-sm font-semibold text-[#0F766E]"
    >
      {{ restaurant?.cuisineType || 'Cuisine' }}
    </div>
  </div>

  <div class="p-6">
    <h2 class="text-2xl font-bold text-gray-900">{{ restaurant?.name || 'Restaurant Name' }}</h2>

    <div class="mt-5 space-y-3 text-sm text-gray-600">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-location-dot text-[#D4A373]"></i>
        <span>{{ restaurant?.city || 'City' }}, {{ restaurant?.address || 'Address' }}</span>
      </div>

      <div class="flex items-center gap-3">
        <i class="fa-solid fa-phone text-[#D4A373]"></i>
        <span>{{ restaurant?.phone || '+00 000 000 0000' }}</span>
      </div>

      <div class="flex items-center gap-3">
        <i class="fa-regular fa-clock text-[#D4A373]"></i>
        <span
          >{{ restaurant?.openingTime || '00:00' }} - {{ restaurant?.closingTime || '23:59' }}</span
        >
      </div>
    </div>

    <button
      (click)="showRestaurant()"
      class="cursor-pointer mt-6 w-full rounded-2xl bg-[#0F766E] py-3 text-white font-semibold hover:bg-[#115E59] transition disabled:cursor-not-allowed disabled:opacity-50"
    >
      Start Booking
    </button>
  </div>
</div>
