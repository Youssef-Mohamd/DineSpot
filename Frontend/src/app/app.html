<app-nav-bar></app-nav-bar>
<div class="min-h-[70vh] bg-[#FFF7ED]">
  <router-outlet></router-outlet>
</div>
<app-footer></app-footer>

<div class="fixed top-5 right-5 z-50 space-y-3">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg min-w-62.5 transition-all duration-300"
      [ngClass]="{
        'bg-emerald-500 text-white': toast.type === 'success',
        'bg-red-500 text-white': toast.type === 'error',
        'bg-gray-800 text-white': toast.type === 'info',
        'opacity-100 translate-x-0': toast.visible,
        'opacity-0 translate-x-10': !toast.visible,
      }"
    >
    <i
        class="fa-solid text-white"
        [ngClass]="{
          'fa-circle-check': toast.type === 'success',
          'fa-circle-xmark': toast.type === 'error',
          'fa-circle-info': toast.type === 'info'
        }"
      ></i>
      <span class="flex-1 text-sm font-medium text-white">
        {{ toast.message }}
      </span>

      <button (click)="toastService.hide(toast.id)">
        <i class="fa-solid fa-xmark text-white text-lg"></i>
      </button>
    </div>
  }
</div>
